<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Приветствие и базовый отклик</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#0a0d14;color:#e6edf3;line-height:1.65;padding:20px}.wrap{max-width:1080px;margin:0 auto}header{padding:22px 24px;border-radius:20px;background:linear-gradient(135deg,#13223b,#0f172a);border:1px solid #263859;margin-bottom:16px}h1{margin:0 0 6px;font-size:24px}p.sub{margin:0;color:#93c5fd;font-size:13px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.tab{padding:7px 14px;border-radius:999px;border:1px solid #263248;background:#131a28;color:#cbd5e1;font-size:12px;font-weight:600;cursor:pointer}.tab.active{background:#1d3560;border-color:#60a5fa;color:#fff}.card{background:#121826;border:1px solid #232d42;border-radius:16px;padding:18px 22px;margin-bottom:14px}.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #1f293d;padding-bottom:10px;margin-bottom:12px}.card-head h2{margin:0;font-size:17px;color:#7cc4ff}.badge{font-size:11px;padding:3px 9px;border-radius:999px;background:#1a2740;color:#93c5fd}.md h1,.md h2,.md h3,.md h4{color:#f1f5f9;margin:16px 0 8px}.md h2{font-size:17px;border-bottom:1px solid #1e293b;padding-bottom:4px}.md h3,.md h4{font-size:14.5px;color:#93c5fd}.md ul,.md ol{padding-left:22px;margin:6px 0}.md li{margin:4px 0}.md hr{border:none;border-top:1px solid #243047;margin:14px 0}.md blockquote{margin:10px 0;padding:8px 14px;border-left:3px solid #60a5fa;background:#0f172a;border-radius:0 8px 8px 0;color:#cbd5e1}.tbl-wrap{overflow-x:auto;margin:10px 0;border-radius:10px;border:1px solid #263248}.md table{width:100%;border-collapse:collapse;font-size:13px}.md th,.md td{border-bottom:1px solid #1f2b40;padding:8px 11px;text-align:left;vertical-align:top}.md th{background:#182438;color:#93c5fd;font-weight:600}.md tr:hover td{background:rgba(96,165,250,0.06)}.md pre{background:#070a10;padding:12px;border-radius:10px;overflow-x:auto;border:1px solid #202a3d}.md code{font-family:monospace;font-size:12.5px;color:#a5f3fc}.tag-ok{background:#064e3b;color:#6ee7b7;padding:1px 6px;border-radius:6px;font-size:11px;font-weight:600}.tag-est{background:#451a03;color:#fcd34d;padding:1px 6px;border-radius:6px;font-size:11px;font-weight:600}.tag-na{background:#27272a;color:#a1a1aa;padding:1px 6px;border-radius:6px;font-size:11px}details{margin-bottom:16px;background:#101622;border:1px solid #232d42;border-radius:14px;padding:12px 16px}summary{cursor:pointer;font-weight:600;font-size:13px;color:#93c5fd}.back{display:inline-block;margin-bottom:12px;color:#7cc4ff;text-decoration:none;font-size:13px;font-weight:600}</style></head><body><div class="wrap"><a class="back" href="../../">← Вернуться в 3D-пульт B2B Nexus</a><header><h1 id="r-title"></h1><p class="sub" id="r-sub"></p></header><details><summary>Показать технический Мастер-Промпт (Слой 0)</summary><div id="r-prompt" style="margin-top:10px;font-size:13px;white-space:pre-wrap;color:#cbd5e1"></div></details><div class="tabs" id="r-tabs"></div><div id="r-body"></div></div><script>const DATA={"title":"Приветствие и базовый отклик","missionType":"deep_research","createdAt":"2026-11-23 10:49 UTC","enhancedPrompt":"Сформулировать профессиональный ответ на пользовательское приветствие в корпоративном стиле. Требования: \n1. Тон – дружелюбный, но деловой. \n2. Длина – не более 150 символов. \n3. Ответ должен включать три обязательных элемента: приветствие, предложение помощи, призыв к действию. \n4. Запрещено использовать вымышленные факты, ссылки или данные, не подтверждённые источниками. \n5. Итоговый продукт – JSON‑объект с полями \"greeting\", \"offer\", \"callToAction\". \n6. Метрика качества – 100% соответствие требованиям, проверка орфографии и пунктуации, отсутствие лишних пробелов. \n7. Оценка готовности – автоматический факт‑чек и валидация схемы JSON.","defaultTab":"all","sections":[{"orbit":1,"orbitName":"Орбита 1 · Разведка","model":"Gemini 3.5 Flash-Lite","content":"{\n  \"analysis\": {\n    \"targetAudience\": \"B2B-клиенты, корпоративные пользователи портала\",\n    \"tone\": \"Дружелюбный, деловой, профессиональный\",\n    \"constraints\": {\n      \"maxLength\": 150,\n      \"language\": \"ru\",\n      \"forbidden\": [\"вымышленные факты\", \"неподтвержденные ссылки\", \"лишние пробелы\", \"воду\"],\n      \"requiredFields\": [\"greeting\", \"offer\", \"callToAction\"],\n      \"format\": \"JSON\",\n      \"validation\": \"Схема JSON + орфография + длина <= 150 символов\"\n    },\n    \"decomposition\": [\n      \"Сформировать приветствие (greeting): нейтральное, деловае обращение.\",\n      \"Сформулировать предложение помощи (offer): конкретное, связанное с функционалом B2B Nexus.\",\n      \"Создать призыв к действию (callToAction): короткий глагол-императив или вопрос.\",\n      \"Собрать в единый JSON, провалидировать длину суммы полей и синтаксис.\"\n    ]\n  },\n  \"readiness\": \"Готов к генерации (Орбита 2)\"\n}"},{"orbit":1,"orbitName":"Орбита 1 · Разведка","model":"Gemini 3.7 Flash","content":"**Анализ исходного запроса (Task 1 — Reconnaissance & Decomposition):**\n\n- **Целевая аудитория:** Корпоративные пользователи, бизнес-партнеры, клиенты в B2B-контексте. Ожидается профессиональный, но дружелюбный тон на русском языке.\n- **Ограничения по длине:** Максимум 150 символов для итогового текстового содержимого (сумма полей `greeting` + `offer` + `callToAction`). JSON-объект валидируется отдельно.\n- **Структура ответа:** JSON-объект с тремя обязательными полями: `\"greeting\"`, `\"offer\"`, `\"callToAction\"`. Поле `greeting` — приветствие, `offer` — предложение помощи, `callToAction` — призыв к действию. Текст в полях должен быть безводным, с правильной орфографией и пунктуацией.\n- **Обязательные компоненты:**\n  1. `greeting` — приветствие (открывающая часть).\n  2. `offer` — предложение помощи"},{"orbit":1,"orbitName":"Орбита 1 · Разведка","model":"Nemotron 3 Ultra 550B","content":"### ОРБИТА 1: РАЗВЕДКА И ДЕКОМПОЗИЦИЯ — ОТЧЁТ\n\n#### 1. Целевая аудитория (ICP)\n*   **Роль:** B2B-клиенты / партнёры / лиды (L1–L3).\n*   **Контекст:** Первый контакт (inbound/outbound), ожидание мгновенной ценности.\n*   **Требования:** Чёткость, уважение времени, нулевой шум.\n\n#### 2. Жёсткие ограничения (Hard Constraints)\n| Параметр | Значение | Тип контроля |\n| :--- | :--- | :--- |\n| **Макс. длина** | **≤ 150 символов** (всего JSON-строки) | `len(json.dumps(output)) <= 150` |\n| **Структура** | Строгий JSON: `greeting`, `offer`, `callToAction` | JSON Schema Validation |\n| **Тон** | Дружелюбный + Деловой (Professional Friendly) | LLM-eval / Regex stop-words |\n| **Контент** | 0% галлюцинаций, 0% внешних ссылок | Fact-check vs Knowledge Base |\n| **Качество** | 100% орфография/пунктуация, `trim()` | Linter + Spellcheck |\n\n#### 3. Обязательные компоненты (Decomposition)\n| Поле | Функция | Оценка длины (симв.) | Риск переполнения |\n| :--- | :--- | :--- | :--- |\n| **`greeting`** | Идентификация бренда + приветствие | ~25–35 | Низкий |\n| **`offer`** | Конкретная ценность / компетенция | ~50–70 | **Высокий** |\n| **`callToAction`** | Низкостоимое действие (Low friction) | ~30–40 | Средний |\n| **Оверхед JSON** | Ключи, кавычки, скобки, пробелы | **~42** | Фиксированный |\n\n#### 4. Карта рисков (Risk Map)\n| ID | Риск | Вероятность | Влияние | Митигация (Layer 1 Action) |\n| :--- | :--- | :--- | :--- | :--- |\n| **R-01** | **Overflow >150 chars** | **Высокая** | Блокирующее (Fail) | Жёсткий бюджет: `greeting≤30`, `offer≤65`, `cta≤35`. Использовать аббревиатуры (Б2Б, CRM). |\n| **R-02** | Нарушение схемы (extra fields, types) | Низкая | Блокирующее | Генерация строго через `Pydantic`/`Zod` схему, а не свободный текст. |\n| **R-03** | \"Водянистое\" `offer` (нет конкретики) | Средняя | Репутационное | Шаблон: `[Глагол] + [Объект] + [Результат/Срок]`. Пример: \"Настроим интеграцию за 1 день\". |\n| **R-04** | Пассивный `callToAction` (\"Напишите нам\") | Средняя | Конверсия | Только активные глаголы: \"Забронируйте слот\", \"Пришлите ТЗ\", \"Запустите демо\". |\n| **R-05** | Орфография/пробелы | Низкая | Качество | Пост-процессинг: `pymorphy2` + `strip()` + `replace('  ', ' ')`. |\n\n#### 5. План выполнения (Next Steps для Layer 2)\n1.  **Layer 2 (Generation):** Сгенерировать 3 варианта JSON в рамках бюджета символов.\n2.  **Layer 3 (Validation):** Авто-проверка схемы + длина + стоп-слова.\n3.  **Layer 4 (Selection):** Выбор лучшего по метрике \"Конкретика / Символ\".\n\n---\n**Статус Орбиты 1:** ✅ **COMPLETE**. Готов к передаче в Layer 2."},{"orbit":1,"orbitName":"Орбита 1 · Разведка","model":"Nemotron 3.5 Super VL","content":"**Анализ запроса**  \n- **Целевая аудитория:** сотрудники B2B‑компаний, менеджеры, руководители, ищущие профессиональное, но дружелюбное общение.  \n- **Ограничения по длине:** ≤ 150 символов (включая пробелы).  \n- **Структура ответа:** JSON‑объект с обязательными полями «greeting», «offer», «callToAction».  \n- **Обязательные компоненты:**  \n  1. **greeting** – приветствие.  \n  2. **offer** – предложение помощи.  \n  3. **callToAction** – призыв к действию."},{"orbit":2,"orbitName":"Орбита 2 · Стратегия и Конкуренты","model":"GPT-oss 120B","content":"{\n  \"greeting\": \"Добрый день! Рад приветствовать вас.\",\n  \"offer\": \"Готов помочь разобраться в наших решениях и подобрать оптимальный вариант.\",\n  \"callToAction\": \"Свяжитесь со мной для уточнения деталей.\"\n}"}]};function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\[ФАКТ\]/g,"<span class=\"tag-ok\">ФАКТ</span>").replace(/\[БЕНЧМАРК\]|\[ЭСТИМАТ\]/g,"<span class=\"tag-est\">БЕНЧМАРК</span>").replace(/\[НЕТ ДАННЫХ\]/g,"<span class=\"tag-na\">НЕТ ДАННЫХ</span>");}function md(text){const lines=String(text||"").replace(/\r/g,"").split("\n");let out="",inCode=false,codeBuf=[],inList=false,i=0;const flushList=()=>{if(inList){out+="</ul>";inList=false;}};while(i<lines.length){const ln=lines[i];if(ln.trim().startsWith("```")){flushList();if(!inCode){inCode=true;codeBuf=[];}else{out+="<pre><code>"+esc(codeBuf.join("\n"))+"</code></pre>";inCode=false;}i++;continue;}if(inCode){codeBuf.push(ln);i++;continue;}if(ln.trim().startsWith("|")&&i+1<lines.length&&/^\s*\|[\s:\-|]+\|\s*$/.test(lines[i+1])){flushList();const parseRow=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());const head=parseRow(ln);i+=2;let tb="<div class=\"tbl-wrap\"><table><thead><tr>"+head.map(c=>"<th>"+inl(c)+"</th>").join("")+"</tr></thead><tbody>";while(i<lines.length&&lines[i].trim().startsWith("|")){const cols=parseRow(lines[i]);tb+="<tr>"+cols.map(c=>"<td>"+inl(c)+"</td>").join("")+"</tr>";i++;}out+=tb+"</tbody></table></div>";continue;}if(/^\s*---+$/.test(ln)){flushList();out+="<hr>";i++;continue;}const hm=ln.match(/^(#{1,4})\s+(.*)$/);if(hm){flushList();const lv=hm[1].length;out+="<h"+lv+">"+inl(hm[2])+"</h"+lv+">";i++;continue;}if(ln.trim().startsWith("> ")){flushList();out+="<blockquote>"+inl(ln.trim().slice(2))+"</blockquote>";i++;continue;}const lm=ln.match(/^\s*[\-\*]\s+(.*)$/);if(lm){if(!inList){out+="<ul>";inList=true;}out+="<li>"+inl(lm[1])+"</li>";i++;continue;}flushList();if(ln.trim())out+="<p>"+inl(ln)+"</p>";i++;}flushList();return out;}document.getElementById("r-title").textContent=DATA.title;document.getElementById("r-sub").textContent="Многомодельный OSINT-анализ B2B Nexus · "+DATA.sections.length+" секций · "+DATA.createdAt;document.getElementById("r-prompt").textContent=DATA.enhancedPrompt;let cur=DATA.defaultTab;function draw(){const tabs=document.getElementById("r-tabs");const orbits=[5,"all",0,4,3,2,1];const labels={5:"★ Итоговый Отчёт",all:"Все секции ("+DATA.sections.length+")",0:"🌐 Живое OSINT-досье",4:"4. Модули",3:"3. Присяжные",2:"2. Стратегия",1:"1. Разведка"};tabs.innerHTML=orbits.map(o=>"<button class=\"tab "+(cur===o?"active":"")+"\" onclick=\"cur="+JSON.stringify(o)+";draw()\">"+labels[o]+"</button>").join("");const list=cur==="all"?DATA.sections.slice().sort((a,b)=>b.orbit-a.orbit):DATA.sections.filter(s=>s.orbit===cur);document.getElementById("r-body").innerHTML=list.length?list.map(s=>"<section class=\"card\"><div class=\"card-head\"><h2>"+esc(s.model)+"</h2><span class=\"badge\">"+esc(s.orbitName)+"</span></div><div class=\"md\">"+md(s.content)+"</div></section>").join(""):"<div class=\"card\">Нет данных на этой вкладке.</div>";}draw();</script></body></html>
