и BARF‑продуктов (домашние животные) в Северном Рейне‑Вестфалии.\n   - Показатели клиентской базы B2B (кол-во оптовых клиентов, средний чек, удержание).\n   - Оценка цепочки поставок (надёжность, сроки, экологичность).\n   - Риски (регуляторные, логистические, конкурентные).\n3. **Выводы** – сформировать SWOT‑анализ, рекомендации по стратегии роста, потенциальным партнёрам и точкам входа в новые каналы.\n4. **Продукт** – интерактивный отчёт в виде автономного index.html, включающий: executive summary, дашборд KPI, таблицы, графики, финансовую модель (3‑летний прогноз) и чёткий вердикт (рекомендация «инвестировать», «пересмотреть», «отказаться»). Все данные должны быть снабжены ссылками на источники и датой последней проверки.\n5. **Качество** – проверка фактов должна проходить по жёстким критериям (см. Orbit 3). Любая неопределённость должна быть отмечена как «недостаточно данных».","defaultTab":"all","sections":[{"orbit":2,"orbitName":"Орбита 2 · Стратегия и Конкуренты","model":"GPT-oss 120B","content":"**Внимание:** Запрос требует предоставления конкретных финансовых и рыночных цифр компании **Daggis Hundesnacks & BARF‑Shop** (Клев, Германия), а также построения полной интерактивной модели HTML‑отчёта.  \n\nВсе требуемые данные (выручка, EBITDA, доля рынка, клиентская база, показатели цепочки поставок, лицензии, патенты и т.п.) находятся в закрытых реестрах — Handelsregister Германии, Bundesanzeiger, отраслевых аналитических базах (Euromonitor, Statista, IFA, GfK), а также в конфиденциальных корпоративных документах (годовые отчёты, внутренние CRM‑отчёты).  \n\n**Я не имею доступа к этим источникам в режиме реального времени и не могу генерировать проверяемые цифры без их подтверждения.** Поэтому в ответе я:\n\n1. **Опишу полностью методологию сбора и верификации данных** (какие реестры, какие запросы, какие форматы выгрузки).  \n2. **Предоставлю шаблон‑структуру интерактивного отчёта** (HTML‑страница, разделы, таблицы, графики, ссылки‑плейсхолдеры).  \n3. **Сформирую перечень конкретных запросов и точек доступа**, которые вы (или ваш аналитический отдел) сможете использовать для получения требуемой информации.  \n4. **Сделаю предварительный SWOT‑анализ** на основе общедоступных отраслевых данных и типовых рисков, отмечив каждую гипотезу как «недостаточно данных», если нет подтверждения.  \n5. **Предложу план действий** — какие шаги выполнить, какие сервисы задействовать, какие KPI‑дашборды построить, какие партнёрства рассмотреть.\n\n---\n\n## 1. Методология сбора данных (только официальные источники)\n\n| № | Источник | Что ищем | Как получить | Формат данных | Примечание |\n|---|----------|----------|--------------|---------------|------------|\n| 1 | **Handelsregister (German Commercial Register)** | Учредительные документы, устав, сведения о директорах, уставный капитал | Онлайн‑запрос через https://www.handelsregister.de/ (платно) | PDF / XML | Данные о юридическом статусе и изменениях в структуре |\n| 2 | **Bundesanzeiger (Federal Gazette)** | Годовые финансовые отчёты (Jahresabschluss), балансы, отчёт о прибылях и убытках, примечания к финансовой отчётности | Поиск по фирменному номеру (HRB) → скачивание PDF | PDF, CSV (через API) | Обязательно проверять дату публикации (обычно 6‑12 мес. после года) |\n| 3 | **Statistisches Bundesamt (Destatis) + IFA** | Объём рынка сухих лакомств и BARF‑продуктов в NRW, рыночные доли | Запрос в открытых базах (Microcensus, Handelsstatistik) | XLSX, CSV | Данные агрегированы по отрасли; нужны уточнения по под‑сегментам |\n| 4 | **Euromonitor International / Mintel** | Аналитика по сегменту «Pet Food», конкурентные профили, цены, каналы | Подписка → выгрузка отчётов | PDF, Excel | Доступен только по подписке; в отчётах часто указаны % долей рынка |\n| 5 | **GfK (Consumer Goods)** | Тренды потребления, средний чек B2B, удержание клиентов | Заказ кастомного исследования | Excel, PowerBI | Требует NDA |\n| 6 | **Patentregister (DPMA)** | Патенты/технологии, связанные с BARF‑формулами | Поиск по фирменному названию | PDF | Проверка наличия собственных технологических преимуществ |\n| 7 | **Лицензии и сертификаты (EU Organic, HACCP, Tierschutz‑Zertifikat)** | Экологичность, безопасность продукции | Запрос в соответствующие органы (EU Commission, German Federal Office of Consumer Protection) | PDF | Важно для оценки ESG‑рисков |\n| 8 | **Транспортные и логистические платформы (DB Schenker, DHL, lokale Speditionen)** | Сроки доставки, CO₂‑выбросы, надёжность | Запрос коммерческого предложения, SLA‑документы | PDF, Excel | Можно сравнить с отраслевыми бенчмарками |\n| 9 | **Публичные интервью/пресс‑релизы (Company website, LinkedIn, Fachmagazine)** | Стратегические цели, планы расширения, новые продукты | Сбор текста, последующий контент‑анализ | TXT/HTML | Оценка «soft‑data» – требует кросс‑валидации |\n|10| **Кредитные рейтинги (Creditreform, Bürgel)** | Финансовая устойчивость, задолженность | Запрос отчёта о платёжеспособности | PDF | Важный индикатор риска |\n\n**Проверка фактов (Orbit 3):**  \n\n- **Источник** – официально‑записанный документ (регистрационный, финансовый, лицензия).  \n- **Точность** – оригинальный PDF/XML без трансформаций.  \n- **Актуальность** – дата публикации ≤ 12 мес. от текущей даты.  \n- **Трассируемость** – ссылка (URL) и номер документа (HRB, Bundesanzeiger‑ID).  \n\nЕсли любой из пунктов не выполнен → помечаем как **«недостаточно данных»**.\n\n---\n\n## 2. Шаблон интерактивного отчёта (index.html)\n\n```html\n<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>Daggis Hundesnacks & BARF‑Shop – B2B Audit 2024‑2027<\/title>\n  <link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css\">\n  <script src=\"https://cdn.jsdelivr.net/npm/chart.js\"><\/script>\n  <style>\n    body{padding:2rem;}\n    .source{font-size:0.85rem;color:#555;}\n  <\/style>\n<\/head>\n<body>\n  <h1 class"},{"orbit":4,"orbitName":"Орбита 4 · Модули и Расчёты","model":"Codestral 1,800,000<\/td>\n                <td>360,000<\/td>\n                <td>20<\/td>\n                <td>20<\/td>\n            <\/tr>\n        <\/tbody>\n    <\/table>\n\n    <h2>SWOT-матрица<\/h2>\n    <table>\n        <thead>\n            <tr>\n                <th>Категория<\/th>\n                <th>Факторы<\/th>\n            <\/tr>\n        <\/thead>\n        <tbody>\n            <tr>\n                <td>Сильные стороны<\/td>\n"}]};function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\[ФАКТ\]/g,"<span class=\"tag-ok\">ФАКТ</span>").replace(/\[БЕНЧМАРК\]|\[ЭСТИМАТ\]/g,"<span class=\"tag-est\">БЕНЧМАРК</span>").replace(/\[НЕТ ДАННЫХ\]/g,"<span class=\"tag-na\">НЕТ ДАННЫХ</span>");}function md(text){const lines=String(text||"").replace(/\r/g,"").split("\n");let out="",inCode=false,codeBuf=[],inList=false,i=0;const flushList=()=>{if(inList){out+="</ul>";inList=false;}};while(i<lines.length){const ln=lines[i];if(ln.trim().startsWith("```")){flushList();if(!inCode){inCode=true;codeBuf=[];}else{out+="<pre><code>"+esc(codeBuf.join("\n"))+"</code></pre>";inCode=false;}i++;continue;}if(inCode){codeBuf.push(ln);i++;continue;}if(ln.trim().startsWith("|")&&i+1<lines.length&&/^\s*\|[\s:\-|]+\|\s*$/.test(lines[i+1])){flushList();const parseRow=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());const head=parseRow(ln);i+=2;let tb="<div class=\"tbl-wrap\"><table><thead><tr>"+head.map(c=>"<th>"+inl(c)+"</th>").join("")+"</tr></thead><tbody>";while(i<lines.length&&lines[i].trim().startsWith("|")){const cols=parseRow(lines[i]);tb+="<tr>"+cols.map(c=>"<td>"+inl(c)+"</td>").join("")+"</tr>";i++;}out+=tb+"</tbody></table></div>";continue;}if(/^\s*---+$/.test(ln)){flushList();out+="<hr>";i++;continue;}const hm=ln.match(/^(#{1,4})\s+(.*)$/);if(hm){flushList();const lv=hm[1].length;out+="<h"+lv+">"+inl(hm
